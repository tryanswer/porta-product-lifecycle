interface:
  display_name: "Porta Product Lifecycle"
  short_description: "Build, package, deploy, and distribute products"
  default_prompt: "Classify the concrete requested product or same-user Porta file-handoff outcome. Route each requested product phase through the narrowest applicable Skills and native adapters; preserve request, receipt, projection, and target-observation boundaries plus separate package, Local Product Release, deployment, distribution, and availability evidence; never substitute a project-local receipt for Porta settlement or any earlier receipt for a later state."

policy:
  allow_implicit_invocation: true
